task: density_cls

data:
  path: /mnt/data_1/yds/多模态/权重模块/outputs/density_cls.mainset_14000.v10.jsonl
  label_field: density_label
  input_mode: query_only
  max_train_samples: 500
  max_val_samples: 200
  max_test_samples: 200

model:
  name_or_path: /mnt/data_1/yds/微调/models/mengzi-bert-base
  num_labels: 5
  max_length: 96
  dropout: 0.1

train:
  seed: 20260423
  device: auto
  epochs: 1
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  class_weight: none
  max_grad_norm: 1.0
  fp16: true
  num_workers: 0

eval:
  batch_size: 32

output:
  dir: /mnt/data_1/yds/多模态/权重模块/checkpoints/smoke_density_cls_v10_mengzi
