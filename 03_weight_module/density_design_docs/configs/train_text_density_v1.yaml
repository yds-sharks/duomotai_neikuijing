version: v1.1

paths:
  data_root: /mnt/data_1/yds/多模态/text_density_design/outputs/v1.1
  density_cls: density_cls.jsonl
  dependency_cls: dependency_cls.jsonl
  density_rank: density_rank.jsonl
  save_dir: /mnt/data_1/yds/多模态/text_density_design/outputs/v1.1/checkpoints

model:
  encoder_name: BGE-M3
  encoder_frozen: true
  embedding_dim: 1024
  structured_feature_dim: 14
  hidden_dims: [256, 128]
  dropout: 0.1
  activation: gelu

tasks:
  ordinal_level: true
  density_regression: true
  dependency_classification: true
  pairwise_ranking: true

loss:
  lambda_ord: 1.0
  lambda_reg: 0.35
  lambda_dep: 0.45
  lambda_rank: 0.70
  lambda_cons: 0.20
  ordinal_class_weights: [1.3, 1.1, 1.0, 1.0, 1.2]
  dependency_class_weights: [1.0, 1.0, 1.2]
  ranking_loss_type: logistic
  regression_loss_type: smooth_l1

optimizer:
  name: AdamW
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

train:
  seed: 20260422
  batch_size: 256
  rank_batch_size: 512
  epochs: 20
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
  mixed_precision: true
  early_stop_patience: 4
  early_stop_metric: val_joint_score
  early_stop_formula: 0.45*MacroF1 + 0.25*PairAcc + 0.20*DepAcc + 0.10*(1-MAE)

features:
  use_embedding: true
  use_char_len: true
  use_token_len: true
  use_slot_counts: true
  use_deictic_flag: true
  use_generic_flag: true
  use_medical_term_ratio: true
  use_rare_term_count: true
  use_redundancy_ratio: true
  use_rule_density_raw: true

baselines:
  run_rule_only: true
  run_linear_head: true
  run_mlp_no_ranking: true
  run_mlp_with_ranking: true

eval:
  metrics:
    - macro_f1
    - weighted_f1
    - pairwise_accuracy
    - spearman
    - kendall_tau
    - mae_density_score
    - dependency_accuracy
  calibration:
    enable: true
    objective: maximize_route_utility
    search_space:
      density_score_threshold: [0.20, 0.85]
      dependency_threshold: [0.5, 1.5]
